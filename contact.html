<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Contact | Space Explorer</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <div class="space">


        <!-- ================= HEADER ================= -->

        <header>

            <div class="logo">
                ◐ SPACE EXPLORER
            </div>


            <nav>

                <a href="index.html">
                    HOME
                </a>

                <a href="about.html">
                    ABOUT
                </a>

                <a href="explore.html">
                    EXPLORE
                </a>
                
                <a href="museum.html">
                    MUSEUM

                </a>

                <a
                    href="contact.html"
                    class="active"
                >
                    CONTACT
                </a>

            </nav>

        </header>



        <!-- ================= CONTACT ================= -->

        <main class="contact-content">


            <div class="contact-heading">

                <p class="eyebrow">
                    GET IN TOUCH
                </p>


                <h1>
                    CONTACT<br>
                    US
                </h1>

            </div>



            <!-- ================= FORM ================= -->

            <form id="contactForm">


                <input
                    type="text"
                    placeholder="YOUR NAME"
                    required
                >


                <input
                    type="email"
                    placeholder="YOUR EMAIL"
                    required
                >


                <textarea
                    placeholder="YOUR MESSAGE"
                    rows="5"
                    required
                ></textarea>


                <button type="submit">

                    SEND MESSAGE →

                </button>


            </form>


        </main>

    </div>


    <!-- ================= SHARED JAVASCRIPT ================= -->

    <script
        type="module"
        src="script.js"
    ></script>

</body>

</html>
