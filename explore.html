<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Explore | Space Explorer</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <div class="space explore-page">


        <!-- ================= HEADER ================= -->

        <header>

            <div class="logo">
                ◐ SPACE EXPLORER
            </div>


            <nav>

                <a href="index.html">
                    HOME
                </a>

                <a href="about.html">
                    ABOUT
                </a>

                <a
                    href="explore.html"
                    class="active"
                >
                    EXPLORE
                </a>

                <a href="museum.html">
                    MUSEUM

                </a>

                <a href="contact.html">
                    CONTACT
                </a>

            </nav>

        </header>



        <!-- ================= MAIN ================= -->

        <main class="explore-main">


            <!-- ================= TITLE ================= -->

            <div class="explore-heading">

                <p class="eyebrow">
                    CHOOSE YOUR DESTINATION
                </p>


                <h1>
                    EXPLORE<br>
                    BEYOND EARTH
                </h1>


                <p class="description">

                    Choose a destination to discover
                    its missions, locations and
                    equipment left behind.

                </p>

            </div>



            <!-- ================= DESTINATIONS ================= -->

            <div class="destinations">


                <!-- ================= MOON ================= -->

                <a
                    href="moon.html"
                    class="planet-card"
                >

                    <div class="planet-view">

                        <div
                            id="exploreMoon3d"
                            class="planet-canvas"
                        ></div>

                    </div>


                    <div class="planet-info">

                        <p>
                            DESTINATION 01
                        </p>


                        <h2>
                            THE MOON
                        </h2>


                        <span>
                            EXPLORE →
                        </span>

                    </div>

                </a>



                <!-- ================= MARS ================= -->

                <a
                    href="mars.html"
                    class="planet-card"
                >

                    <div class="planet-view">

                        <div
                            id="mars3d"
                            class="planet-canvas"
                        ></div>

                    </div>


                    <div class="planet-info">

                        <p>
                            DESTINATION 02
                        </p>


                        <h2>
                            MARS
                        </h2>


                        <span>
                            EXPLORE →
                        </span>

                    </div>

                </a>


            </div>

        </main>

    </div>


    <!-- ================= SHARED JAVASCRIPT ================= -->

    <script
        type="module"
        src="script.js"
    ></script>

</body>

</html>
